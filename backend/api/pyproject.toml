[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["staticfiles", "merchants/migrations", "analytics/migrations", "chat/migrations", "agent/migrations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "DJ",  # flake8-django
    "RUF", # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = [
    "analytics",
    "chat",
    "config",
    "controllers",
    "facades",
    "merchants",
    "repositories",
    "services",
    "shared",
]

[tool.ruff.lint.per-file-ignores]
# Settings modules intentionally star-import the shared base.
"config/settings/dev.py" = ["F403", "F405"]
"config/settings/prod.py" = ["F403", "F405"]
# Django auto-generates migration files — line length and mutable-class defaults
# are unavoidable and not our concern.
"merchants/migrations/*.py" = ["E501", "RUF012", "I001"]
"analytics/migrations/*.py" = ["E501", "RUF012", "I001"]
"chat/migrations/*.py" = ["E501", "RUF012", "I001"]
"agent/migrations/*.py" = ["E501", "RUF012", "I001"]
# RUF012 false positives on Django Meta.indexes (lists) and APIView class attrs.
"**/models.py" = ["RUF012"]
"**/apps.py" = ["RUF012"]
"controllers/*.py" = ["RUF012"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
pythonpath = ["."]
testpaths = ["tests"]
