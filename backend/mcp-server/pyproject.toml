[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "RUF"]

[tool.ruff.lint.isort]
known-first-party = [
    "api",
    "config",
    "controllers",
    "facades",
    "gateway",
    "mcp_server",
    "merchants",
    "repositories",
    "services",
    "shared",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017"]
