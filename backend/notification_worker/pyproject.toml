[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "RUF", "UP"]
ignore = ["UP001"]

[tool.ruff.lint.isort]
known-first-party = [
    "analytics",
    "gateway",
    "merchants",
    "notification_worker",
    "repositories",
    "services",
    "shared",
]

[tool.ruff.lint.per-file-ignores]
"adapters/channels.py" = ["E501"]
"main.py" = ["RUF013"]
