[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zarinpal-dashboard-shared"
version = "0.1.0"
description = "Shared value objects, DTOs, and protocol interfaces for api, mcp-server, temporal-worker, and notification-worker."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*"]
