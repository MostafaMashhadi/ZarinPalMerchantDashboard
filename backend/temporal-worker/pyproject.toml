[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = [
    "activities",
    "agent",
    "chat",
    "analytics",
    "merchants",
    "queues",
    "cost_ledger",
    "event_bus",
    "shared",
    "workflows",
]

[tool.ruff.lint.per-file-ignores]
"**/__pycache__/**" = ["ALL"]
