# Chat is NOT a Compose service.
# Synchronous turn-handling and SSE live in `api` (§9.6).
# Chat memory consolidation runs inside `temporal-worker` on `chat-queue` (Sprint 3).
# Do not add a stray chat service.
#
# mcp-server, temporal-worker, and notification-worker are intentionally
# omitted until Sprints 3–4. They will share `backend/shared` via
# `pip install -e ../shared`.

name: zarinpal-dashboard

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zarinpal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zarinpal}
      POSTGRES_DB: ${POSTGRES_DB:-zarinpal}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zarinpal} -d ${POSTGRES_DB:-zarinpal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Dedicated Postgres for Temporal — not the application database.
  temporal-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      POSTGRES_DB: ${TEMPORAL_POSTGRES_DB:-temporal}
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TEMPORAL_POSTGRES_USER:-temporal} -d ${TEMPORAL_POSTGRES_DB:-temporal}"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    # Pin a concrete Alpine image: the floating 24.8 manifest has produced an
    # unusable `/entrypoint.sh: exec format error` on local Docker hosts.
    image: clickhouse/clickhouse-server:24.8.4.13-alpine
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-zarinpal}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-zarinpal}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-zarinpal}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-zarinpal}"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-zarinpal}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.25.2
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${TEMPORAL_POSTGRES_USER:-temporal}
      POSTGRES_PWD: ${TEMPORAL_POSTGRES_PASSWORD:-temporal}
      POSTGRES_SEEDS: temporal-postgres
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"

  # Sprint 0.2 — Django + DRF. Also hosts chat turn-handling (§9.6); no separate chat service.
  # ASGI runtime: uvicorn (dev, autoreload) / gunicorn + uvicorn workers (prod) — SSE-ready.
  api:
    build:
      context: ./backend
      dockerfile: api/Dockerfile
    env_file:
      - path: .env
        required: false
    command: ["dev"]
    volumes:
      - ./backend/api:/app
      - ./backend/shared:/opt/shared
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    ports:
      - "${API_PORT:-8000}:8000"

  # Sprint 0.3 — React app; chat panel from Sprint 3 onward.
  frontend:
    build:
      context: ./frontend
    env_file:
      - path: .env
        required: false
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-5173}:5173"

  # Sprint 1 — CSV ingestion pipeline.
  ingestion:
    # The ingestion image is introduced with the ingestion pipeline.  Keeping
    # it out of the web-app profile prevents `docker compose --profile app up`
    # from attempting to build a service whose Dockerfile has not landed yet.
    profiles: ["ingestion"]
    build:
      context: ./backend/ingestion
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

volumes:
  postgres_data:
  temporal_postgres_data:
  clickhouse_data:
  redis_data:
